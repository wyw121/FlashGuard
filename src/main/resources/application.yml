spring:
  application:
    name: flashguard
  datasource:
    url: ${FLASHGUARD_DB_URL:jdbc:mysql://localhost:3306/flashguard?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${FLASHGUARD_DB_USERNAME:flashguard}
    password: ${FLASHGUARD_DB_PASSWORD:flashguard-dev}
    hikari:
      maximum-pool-size: ${FLASHGUARD_DB_POOL_SIZE:20}
      minimum-idle: 2
  flyway:
    enabled: true
  data:
    redis:
      host: ${FLASHGUARD_REDIS_HOST:localhost}
      port: ${FLASHGUARD_REDIS_PORT:6379}
      connect-timeout: ${FLASHGUARD_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${FLASHGUARD_REDIS_COMMAND_TIMEOUT:2s}
  jackson:
    default-property-inclusion: non_null

flashguard:
  reservation:
    timeout: ${FLASHGUARD_RESERVATION_TIMEOUT:120s}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${FLASHGUARD_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    enable:
      all: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} |%5p| [%thread] %X{traceId:-} %X{requestId:-} %X{reservationId:-} %X{messageKey:-} - %msg%n"
