services:
  namesrv:
    image: apache/rocketmq:5.3.2
    profiles: [mq]
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: '-Xms256m -Xmx256m -Xmn128m'
    ports:
      - '${FLASHGUARD_MQ_NAMESRV_PORT:-9876}:9876'
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/127.0.0.1/9876']
      interval: 3s
      timeout: 2s
      retries: 30
  broker:
    image: apache/rocketmq:5.3.2
    profiles: [mq]
    depends_on:
      namesrv:
        condition: service_healthy
    environment:
      JAVA_OPT_EXT: '-Xms512m -Xmx512m -Xmn256m'
    command:
      - sh
      - -c
      - |
        cp /home/rocketmq/config/broker.conf /tmp/flashguard-broker.conf
        printf '\nlistenPort=${FLASHGUARD_MQ_BROKER_PORT:-10911}\nbrokerIP1=${FLASHGUARD_MQ_BROKER_IP:-127.0.0.1}\n' >> /tmp/flashguard-broker.conf
        exec sh mqbroker -n namesrv:9876 -c /tmp/flashguard-broker.conf
    ports:
      - '${FLASHGUARD_MQ_BROKER_PORT:-10911}:${FLASHGUARD_MQ_BROKER_PORT:-10911}'
    volumes:
      - ./config/rocketmq/broker.conf:/home/rocketmq/config/broker.conf:ro
      - flashguard-mq-store:/home/rocketmq/store
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo > /dev/tcp/127.0.0.1/${FLASHGUARD_MQ_BROKER_PORT:-10911}']
      interval: 3s
      timeout: 2s
      retries: 40
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_ROOT_PASSWORD: ${FLASHGUARD_MYSQL_ROOT_PASSWORD:-flashguard-root-dev}
      MYSQL_DATABASE: ${FLASHGUARD_MYSQL_DATABASE:-flashguard}
      MYSQL_USER: ${FLASHGUARD_DB_USERNAME:-flashguard}
      MYSQL_PASSWORD: ${FLASHGUARD_DB_PASSWORD:-flashguard-dev}
    ports:
      - "${FLASHGUARD_MYSQL_PORT:-3306}:3306"
    command:
      - --default-time-zone=+00:00
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    volumes:
      - flashguard-mysql-data:/var/lib/mysql
  redis:
    image: ${FLASHGUARD_REDIS_IMAGE:-redis:7.4.8}
    profiles:
      - redis
    ports:
      - "${FLASHGUARD_REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - flashguard-redis-data:/data

volumes:
  flashguard-mq-store:
  flashguard-mysql-data:
  flashguard-redis-data:
